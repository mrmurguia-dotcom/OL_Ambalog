<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carga FC / RTO - M2</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Librería SheetJS para leer archivos Excel JDE (.xlsx, .xls, .csv) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
</head>
<body class="bg-slate-100 p-4 md:p-8">
    <div class="max-w-6xl mx-auto bg-white rounded-3xl shadow-2xl p-6 md:p-8 border border-slate-200">
        <!-- Encabezado Principal -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8 border-b pb-4">
            <div>
                <h1 class="text-3xl font-black text-blue-900 italic">CARGA FC / RTO - GP</h1>
                <p class="text-slate-500 text-sm mt-1">Carga masiva de comprobantes y validación JDE - M2</p>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <a href="https://docs.google.com/spreadsheets/d/1VpLMSK3QcEj2bzdJf2uNBCF3e00b5mgkB9jjfoybbxg/edit?usp=sharing" target="_blank" rel="noopener noreferrer" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow-md transition-all flex items-center gap-2">
                    📊 VER PLANILLA SHEETS
                </a>
            </div>
        </div>

        <!-- Barra de Controles y Carga Excel -->
        <div class="mb-6 bg-blue-50 p-4 rounded-2xl border border-blue-200 flex flex-col md:flex-row justify-between items-stretch md:items-center gap-4">
            <div>
                <label class="block text-blue-900 font-bold mb-1 text-xs uppercase tracking-wider">FECHA DE COMPROBANTES:</label>
                <input type="date" id="fechaReparto" class="p-2.5 rounded-xl border-2 border-blue-300 focus:border-orange-500 outline-none bg-white font-bold text-blue-900 shadow-sm text-sm">
            </div>
            
            <div class="flex items-center gap-3">
                <label for="excelInput" class="cursor-pointer bg-blue-900 hover:bg-blue-800 text-white font-black text-xs px-5 py-3 rounded-xl shadow-md hover:shadow-lg transition-all flex items-center gap-2">
                    📊 VALIDAR / CARGAR CON EXCEL JDE (4211)
                </label>
                <input type="file" id="excelInput" accept=".xlsx, .xls, .csv" class="hidden">
            </div>

            <div class="text-right flex items-center">
                <span class="text-xs bg-blue-200 text-blue-800 px-3 py-1.5 rounded-full font-bold">Modo Acumulativo Habilitado</span>
            </div>
        </div>

        <!-- Zona de Drop / Carga de PDFs -->
        <div id="dropZone" class="border-4 border-dashed border-blue-200 rounded-2xl p-10 text-center cursor-pointer hover:bg-blue-50 transition-all mb-8 group">
            <div class="text-blue-400 text-4xl mb-2 group-hover:scale-110 transition-transform">📁</div>
            <p class="text-slate-700 font-black uppercase tracking-tight text-sm">Arrastrá facturas/remitos PDF o hacé click aquí</p>
            <p class="text-slate-400 text-xs mt-1">Podés cargar múltiples PDFs de facturas o remitos del Grupo Peñaflor.</p>
            <input type="file" id="fileInput" multiple accept="application/pdf" class="hidden">
        </div>

        <!-- Panel de Resultados -->
        <div id="results" class="hidden animate-in fade-in duration-500">
            <div class="bg-blue-900 text-white p-4 rounded-xl flex justify-between items-center mb-6 shadow-lg">
                <span class="font-bold uppercase text-xs tracking-widest" id="resumenTexto">Resumen de Carga</span>
                <button onclick="enviarALaNube()" id="btnSync" class="bg-orange-500 hover:bg-orange-600 px-8 py-2 rounded-lg font-black shadow-md active:scale-95 transition-all text-white">SINCRONIZAR DATOS</button>
            </div>
            <div id="contenedorTablas" class="space-y-6"></div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzlPL8lhl8n_H2kioGd4CmBRrEG2X9mpa83eo0XgsMIbnxFD9ppAvWS7yT0NqKfNB-KLA/exec"; 

        let store = {};
        let maestroSKU = {};
        let maestroCargado = false;

        document.getElementById('fechaReparto').valueAsDate = new Date();

        // --- CARGA INICIAL DEL MAESTRO DE SKUS DESDE APPS SCRIPT ---
        async function cargarMaestroSKU() {
            try {
                const res = await fetch(`${WEB_APP_URL}?action=getMaestroSKU`);
                const data = await res.json();
                if (data && typeof data === 'object') {
                    maestroSKU = data;
                    maestroCargado = true;
                    console.log("Maestro SKU cargado correctamente:", Object.keys(maestroSKU).length, "artículos.");
                }
            } catch (e) {
                console.warn("No se pudo cargar el maestro SKU en linea:", e);
            }
        }
        cargarMaestroSKU();

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const excelInput = document.getElementById('excelInput');

        dropZone.onclick = (e) => {
            fileInput.click();
        };

        fileInput.onclick = (e) => e.stopPropagation();
        fileInput.onchange = (e) => {
            if (e.target.files.length > 0) {
                procesar(e.target.files);
                fileInput.value = "";
            }
        };

        excelInput.onchange = (e) => {
            if (e.target.files.length > 0) {
                validarYCruzarExcelJDE(e.target.files[0]);
                excelInput.value = "";
            }
        };

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('bg-blue-100', 'border-blue-400');
        });
        
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('bg-blue-100', 'border-blue-400');
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('bg-blue-100', 'border-blue-400');
            if (e.dataTransfer.files.length > 0) {
                procesar(e.dataTransfer.files);
            }
        });

        // --- HELPER PARA PARSEAR NÚMEROS CON FORMATO ESPAÑOL/ARGENTINA ---
        function parsearCantidad(valor) {
            if (valor === null || valor === undefined) return 0;
            let str = String(valor).trim();
            if (!str) return 0;
            str = str.replace(/\./g, '').replace(',', '.');
            let num = parseFloat(str);
            return isNaN(num) ? 0 : num;
        }

        function normalizarHeader(h) {
            return String(h || '')
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-z0-9]/g, "");
        }

        // --- PROCESAMIENTO DINÁMICO DE EXCEL JDE 4211 ---
        function validarYCruzarExcelJDE(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const matrix = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

                    if (!matrix || matrix.length === 0) return alert("El archivo Excel está vacío.");

                    // Detectar la fila de encabezados dinámicamente
                    let headerRowIndex = -1;
                    let idxFactura = -1, idxSKU = -1, idxCant = -1, idxUM = -1;

                    for (let r = 0; r < Math.min(matrix.length, 10); r++) {
                        const row = matrix[r];
                        if (Array.isArray(row)) {
                            row.forEach((cell, cIdx) => {
                                const norm = normalizarHeader(cell);
                                if (norm.includes("referencia2") || norm.includes("ref2") || norm.includes("factura")) idxFactura = cIdx;
                                if (norm.includes("2nacart") || norm.includes("articulo") || norm.includes("sku")) idxSKU = cIdx;
                                if (norm.includes("cantidad") || norm.includes("cajas")) idxCant = cIdx;
                                if (norm.includes("um") || norm.includes("unidadmedida")) idxUM = cIdx;
                            });
                            if (idxFactura !== -1 && idxSKU !== -1 && idxCant !== -1) {
                                headerRowIndex = r;
                                break;
                            }
                        }
                    }

                    if (headerRowIndex === -1) {
                        return alert("No se encontraron las columnas clave ('Referencia 2', '2º nº artículo', 'Cantidad') en el Excel.");
                    }

                    // Construir tabla de datos JDE
                    let filasJDE = [];
                    for (let r = headerRowIndex + 1; r < matrix.length; r++) {
                        const row = matrix[r];
                        if (!row || row.length === 0) continue;
                        
                        let nroFact = String(row[idxFactura] || '').trim();
                        let sku = String(row[idxSKU] || '').trim();
                        let cant = parsearCantidad(row[idxCant]);

                        if (nroFact && sku) {
                            filasJDE.push({
                                factura: nroFact,
                                sku: sku,
                                cantidad: cant
                            });
                        }
                    }

                    // Cruzar con el store
                    let concilCount = 0;
                    for (let cp in store) {
                        store[cp].docs.forEach(doc => {
                            const nroLimpio = doc.numero.replace(/\D/g, '');
                            const coincidenciaLineas = filasJDE.filter(f => {
                                const fLimpia = f.factura.replace(/\D/g, '');
                                return fLimpia && (nroLimpio.endsWith(fLimpia) || fLimpia.endsWith(nroLimpio));
                            });

                            if (coincidenciaLineas.length > 0) {
                                doc.validadoExcel = true;
                                let totalLitrosFact = 0;
                                coincidenciaLineas.forEach(linea => {
                                    let skuKey = String(linea.sku).trim();
                                    let ltsUnit = maestroSKU[skuKey] || maestroSKU[skuKey.padStart(5, '0')] || 0;
                                    totalLitrosFact += linea.cantidad * ltsUnit;
                                });
                                if (totalLitrosFact > 0) doc.litros = totalLitrosFact;
                                concilCount++;
                            }
                        });
                    }

                    dibujar();
                    alert(`✓ Validación completada. Se conciliaron ${concilCount} comprobantes con el Excel JDE.`);

                } catch (err) {
                    console.error("Error procesando Excel:", err);
                    alert("Ocurrió un error al procesar la planilla de Excel JDE.");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // --- CÁLCULO DE LITROS DESDE TEXTO PDF ---
        function calcularLitrosComprobante(txt) {
            if (!maestroCargado || Object.keys(maestroSKU).length === 0) return { litros: 0, itemsCount: 0 };
            
            let totalLitros = 0;
            let itemsCount = 0;
            const lineas = txt.split('\n');

            lineas.forEach(linea => {
                const skuMatch = linea.match(/\b(\d{5})\b/);
                if (skuMatch) {
                    const sku = skuMatch[1];
                    let ltsUnit = maestroSKU[sku] !== undefined ? maestroSKU[sku] : 0;
                    if (ltsUnit > 0) {
                        const cantMatch = linea.match(/\b(\d{1,3}(?:\.\d{3})*(?:,\d+)?)\b/g);
                        if (cantMatch) {
                            for (let c of cantMatch) {
                                if (c !== sku) {
                                    let val = parsearCantidad(c);
                                    if (val > 0 && val < 50000) {
                                        totalLitros += val * ltsUnit;
                                        itemsCount++;
                                        break;
                                    }
                                }
                            }
                        }
                    }
                }
            });
            return { litros: totalLitros, itemsCount: itemsCount };
        }

        // --- PROCESAMIENTO DE PDFs ---
        async function procesar(files) {
            const archivosArray = Array.from(files);
            
            const promesasProcesamiento = archivosArray.map(async (file) => {
                try {
                    const pdf = await pdfjsLib.getDocument(await file.arrayBuffer()).promise;
                    let paginasDoc = [];
                    
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const pg = await pdf.getPage(i);
                        const txtContent = await pg.getTextContent();
                        const txt = txtContent.items.map(it => it.str).join(' ');
                        paginasDoc.push({ paginaNum: i, txt: txt });
                    }

                    let comprobantesEnPDF = {};

                    paginasDoc.forEach(p => {
                        const txt = p.txt;
                        const esRemito = /(Remito\s*R|Documento\s*no\s*v[aá]lido\s*como\s*factura)/i.test(txt);
                        const labelTipo = esRemito ? "REMITO" : "FACTURA";
                        
                        const nroMatch = txt.match(/Nro\.:\s*(\d{4,5}\s*-\s*\d{8})/);
                        let nro = nroMatch ? nroMatch[1] : null;

                        if (nro) {
                            if (!comprobantesEnPDF[nro]) {
                                const cp = txt.match(/Carta\s+Porte.*?:\s*([\d-]+)/)?.[1] || "S/CP";
                                const cliMatch = txt.match(/Cliente:\s*(\d+\s+.*?)(?=\s+SN\s+|\s+SR\s+|\s+VN\s+|\s+Direcci)/i);
                                const cli = cliMatch ? cliMatch[1].trim() : (txt.match(/Cliente:\s*(\d+\s+[A-Za-z\s.,]+)/)?.[1]?.trim() || "Cliente");
                                
                                const dirMatch = txt.match(/Dirección\s+(.*?)(?=\s+Categoría|\s+LU\s+A\s+VI|\s+VN\s+|\s+SR\s+\d{4}|\s+SN\s+\d{4}|\s+\d[A-Z]\s+\d{4})/i);
                                const dir = dirMatch ? dirMatch[1].trim() : (txt.match(/Dirección\s+(.*?)(?=\s+Categoría)/)?.[1]?.trim() || "S/D");

                                const viMatch = txt.match(/VI\s+(\d[\d\s]+)/i);
                                let viCode = viMatch ? viMatch[1].trim().replace(/\s+/g, ' ') : null;

                                comprobantesEnPDF[nro] = {
                                    cp: cp,
                                    numero: nro,
                                    tipo: labelTipo,
                                    cliente: cli,
                                    direccion: dir,
                                    cajas: 0,
                                    unidades: 0,
                                    importe: 0,
                                    vi: viCode,
                                    litros: 0,
                                    paginasTxt: []
                                };
                            }
                            comprobantesEnPDF[nro].paginasTxt.push(txt);
                        }
                    });

                    let docsArchivo = [];
                    for (let nro in comprobantesEnPDF) {
                        const itemDoc = comprobantesEnPDF[nro];
                        const fullTxt = itemDoc.paginasTxt.join('\n');

                        const cajas = parsearCantidad(fullTxt.match(/Total\s+Cajas\s*:\s*([\d.,]+)/i)?.[1]) || 0;
                        let unidades = 0;

                        if (itemDoc.tipo === 'REMITO') {
                            const unMatches = [...fullTxt.matchAll(/\bUN\b\s*(\d+[\.,]\d+)/gi)];
                            unMatches.forEach(m => {
                                unidades += parsearCantidad(m[1]);
                            });
                        } else {
                            const matchUnidades = fullTxt.match(/Total\s+Unidades\s*:\s*([\d.,]+)/i);
                            const matchBotellas = fullTxt.match(/Botellas\s*:\s*([\d.,]+)/i);

                            if (matchUnidades) {
                                unidades = parsearCantidad(matchUnidades[1]);
                            } else if (matchBotellas) {
                                unidades = parsearCantidad(matchBotellas[1]);
                            }
                        }

                        const matchesTotal = [...fullTxt.matchAll(/(?:Total|Subtotal)\s*:\s*([\d.,]+)/gi)];
                        let total = 0;
                        if (matchesTotal.length > 0) {
                            const ultimoValor = matchesTotal[matchesTotal.length - 1][1];
                            total = parsearCantidad(ultimoValor);
                        }

                        const calcLts = calcularLitrosComprobante(fullTxt);

                        docsArchivo.push({
                            cp: itemDoc.cp,
                            doc: {
                                numero: itemDoc.numero,
                                tipo: itemDoc.tipo,
                                cliente: itemDoc.cliente,
                                direccion: itemDoc.direccion,
                                cajas: cajas,
                                unidades: unidades,
                                importe: total,
                                vi: itemDoc.vi,
                                litros: calcLts.litros
                            }
                        });
                    }

                    return docsArchivo;
                } catch (err) {
                    console.error("Error procesando PDF:", err);
                    return [];
                }
            });

            const resultados = await Promise.all(promesasProcesamiento);

            resultados.forEach(listaDocs => {
                listaDocs.forEach(item => {
                    const cp = item.cp;
                    const d = item.doc;

                    if (!store[cp]) store[cp] = { docs: [] };
                    
                    let index = store[cp].docs.findIndex(existing => existing.numero === d.numero && existing.tipo === d.tipo);
                    if (index === -1) {
                        store[cp].docs.push(d);
                    } else {
                        if (d.cajas > store[cp].docs[index].cajas) store[cp].docs[index].cajas = d.cajas;
                        if (d.importe > store[cp].docs[index].importe) store[cp].docs[index].importe = d.importe;
                        if (d.litros > store[cp].docs[index].litros) store[cp].docs[index].litros = d.litros;
                    }
                });
            });

            // Filtro VI (Consolidación Factura vs Remito)
            for (let cp in store) {
                let docs = store[cp].docs;
                let viMap = {};
                docs.forEach((d, idx) => {
                    if (d.vi) {
                        if (!viMap[d.vi]) viMap[d.vi] = { factura: null, remito: null };
                        if (d.tipo === 'FACTURA') viMap[d.vi].factura = idx;
                        if (d.tipo === 'REMITO') viMap[d.vi].remito = idx;
                    }
                });
                let indicesAEliminar = [];
                for (let vi in viMap) {
                    if (viMap[vi].factura !== null && viMap[vi].remito !== null) {
                        indicesAEliminar.push(viMap[vi].remito);
                    }
                }
                store[cp].docs = docs.filter((_, idx) => !indicesAEliminar.includes(idx));
            }

            dibujar();
        }

        // --- RENDERIZADO EN PANTALLA ---
        function dibujar() {
            const container = document.getElementById('contenedorTablas');
            container.innerHTML = '';
            
            let totalDocumentos = 0;

            for (let cp in store) {
                totalDocumentos += store[cp].docs.length;
                let filas = store[cp].docs.map(d => `
                    <tr class="border-b text-sm hover:bg-slate-50 transition-colors ${d.validadoExcel ? 'bg-emerald-50/50' : ''}">
                        <td class="p-3 font-bold text-slate-700">
                            ${d.numero}
                            ${d.validadoExcel ? '<span class="ml-1 text-[10px] bg-emerald-100 text-emerald-800 font-bold px-1.5 py-0.5 rounded">✓ JDE</span>' : ''}
                        </td>
                        <td class="p-3 text-[10px]"><span class="${d.tipo === 'REMITO' ? 'bg-orange-100 text-orange-700' : 'bg-blue-100 text-blue-700'} px-2 py-0.5 rounded font-bold">${d.tipo}</span></td>
                        <td class="p-3 text-slate-500">${d.cliente}</td>
                        <td class="p-3 text-right font-black text-blue-600">${d.cajas} CJ</td>
                        <td class="p-3 text-right font-bold text-slate-600">${d.unidades} UN</td>
                        <td class="p-3 text-right font-bold text-emerald-600">${(d.litros || 0).toLocaleString('es-AR', {minimumFractionDigits: 1, maximumFractionDigits: 1})} L</td>
                        <td class="p-3 text-right font-medium text-slate-800">$${d.importe.toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    </tr>
                `).join('');

                container.innerHTML += `
                    <div id="card-${cp}" class="border border-slate-200 rounded-2xl overflow-hidden bg-white shadow-sm mb-6">
                        <div class="bg-blue-50 px-4 py-3 border-b font-black text-blue-900 flex justify-between items-center">
                            <span>CP: ${cp}</span>
                            <div class="flex gap-2">
                                <span class="text-xs bg-white px-2 py-1 rounded-full border border-blue-200">${store[cp].docs.length} COMPROBANTES</span>
                                <button onclick="quitarCP('${cp}')" class="bg-red-100 text-red-600 hover:bg-red-600 hover:text-white px-3 py-1 rounded-lg text-xs transition-colors">✕ QUITAR</button>
                            </div>
                        </div>
                        <table class="w-full text-left">
                            <thead class="text-[10px] text-slate-400 uppercase font-bold bg-slate-50">
                                <th class="p-3">Factura/Remito</th>
                                <th class="p-3">Tipo</th>
                                <th class="p-3">Cliente</th>
                                <th class="p-3 text-right">Cajas</th>
                                <th class="p-3 text-right">Unidades</th>
                                <th class="p-3 text-right">Litros</th>
                                <th class="p-3 text-right">Importe</th>
                            </thead>
                            <tbody>${filas}</tbody>
                        </table>
                    </div>
                `;
            }
            document.getElementById('resumenTexto').innerText = `Resumen de Carga (${totalDocumentos} comprobantes listos)`;
            document.getElementById('results').classList.remove('hidden');
        }

        function quitarCP(cp) {
            if(confirm(`¿Deseas quitar la Carta de Porte ${cp}?`)) {
                delete store[cp];
                dibujar();
                if(Object.keys(store).length === 0) {
                    document.getElementById('results').classList.add('hidden');
                }
            }
        }

        async function enviarALaNube() {
            const fechaInput = document.getElementById('fechaReparto').value;
            if(!fechaInput) return alert("Por favor selecciona una fecha");

            const [y, m, d] = fechaInput.split('-');
            const fechaFormateada = `${d}-${m}-${y}`;

            if(Object.keys(store).length === 0) return alert("No hay datos para sincronizar");

            const btn = document.getElementById('btnSync');
            btn.innerText = "PROCESANDO...";
            btn.disabled = true;
            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ datos: store, fechaManual: fechaFormateada })
                });
                alert("✓ Sincronizado con éxito. Se guardó en la pestaña correspondiente.");
                store = {}; 
                document.getElementById('results').classList.add('hidden');
            } catch (e) {
                alert("Error de conexión al sincronizar.");
            }
            btn.innerText = "SINCRONIZAR DATOS";
            btn.disabled = false;
        }
    </script>
</body>
</html>
